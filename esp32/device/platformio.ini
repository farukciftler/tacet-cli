; The source is .cpp rather than .ino: PlatformIO preprocesses an .ino into
; C++ before compiling and that step fails outright on the 92 KiB weights header,
; with an assert rather than a diagnostic. Nothing in the file needs the .ino
; sugar - it declares setup() and loop() and includes Arduino.h itself.
;
; The ESP8266 build, because the Arduino core's stable macOS toolchain is
; x86_64-only and this is an arm64 Mac. PlatformIO ships a native xtensa-lx106
; toolchain, so the board can be built without Rosetta and without admin rights.
;
; -O2 AND NOT THE FRAMEWORK DEFAULT -Os. slots.c is measured at -O2 on the host
; and the point of this directory is to compare the same code across the two, so
; the optimisation level has to be the same on both sides or the ratio measures
; the flag instead of the silicon. A shipping firmware would likely choose -Os;
; README.md records what that costs rather than leaving it to be assumed.

[platformio]
src_dir = slots_device

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2
