[package]
name = "sirr-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

# BAGIMLILIK GEREKCESI — `ureq`.
#
# Sifir-bagimlilik kimligi "her seyi elde yaz" degil, "elde yazilabilecek olani
# bagimlilikla degistirme"dir. zip/deflate/crc32 elde yazildi cunku ihtiyacimiz
# olan altkume birkac yuz satirdi ve girdisi bizim urettigimiz veriydi. TLS
# oyle DEGIL: X.509 zinciri, sertifika dogrulama, TLS 1.3 el sikismasi ve
# sifre paketleri elde yazildiginda ortaya cikan sey "az bagimlilik" degil,
# GUVENLIK ACIGIdir. Yanlis yazilmis bir dogrulayici sessizce her sertifikayi
# kabul eder ve kullanicinin sorgusu ortadaki adama gider.
#
# `reqwest` DEGERLENDIRILDI ve REDDEDILDI: tokio calistiricisini de beraberinde
# getiriyor. Kok Cargo.toml'da tokio bilerek kaldirildi ("bu crate calistirici
# SECMEMELI") ve tek bir GET istegi ugruna o karari geri almak orantisiz.
#
# `ureq` secildi: senkron, calistirici secmez, TLS'i rustls'e verir.
# `default-features = false` + yalniz `rustls`: gzip, cookie, charset ve
# proxy ozellikleri cekilmiyor — SearXNG'den duz JSON okuyoruz, fazlasi
# saldiri yuzeyi.
ureq = { version = "3", default-features = false, features = ["rustls"] }
