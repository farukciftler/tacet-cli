[package]
name = "sirr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# IKILININ ADI `sirr`, crate adi `sirr-cli`. Kullanici terminale `sirr` yazar;
# `cargo install --path crates/sirr-cli` bu adi ~/.cargo/bin'e koyar. Crate
# adinin ayri kalmasi bilincli: workspace icinde `-cli` soneki hangi crate'in
# ikili oldugunu soyler, kullaniciyi ise ilgilendirmez.
[[bin]]
name = "sirr"
path = "src/main.rs"

# clap YALNIZ burada: arguman ayristirma bir kabuk isidir, kutuphane
# katmanlarinin hicbiri onu gormemeli. Motor varsayilan ozelliklerle alinir
# (candle YOK) — `--motor candle` istendiginde bu crate `candle` ozelligiyle
# yeniden derlenir, varsayilan `cargo build` saniyeler icinde biter.
[dependencies]
sirr-cekirdek.workspace = true
sirr-araclar.workspace = true
sirr-gramer.workspace = true
sirr-motor.workspace = true
# Beceri (skill) ve hafiza katmanlari kabuk fazinda URETIME baglanir: kabuk
# her turda uyan beceriyi/notlari secip isteme ekler. Ikisi de AG YOK; deposu
# yerel dosyadir. Katman crate'leri, ikinci bir "arac listesi" yaratmadan
# dogrudan buradan besleniyor.
sirr-beceri.workspace = true
sirr-hafiza.workspace = true
sirr-eval.workspace = true
serde_json.workspace = true
clap.workspace = true

[features]
default = []
candle = ["sirr-motor/candle"]
# Apple GPU (Metal): candle'in metal cekirdegini acar. AYRI ozellik — bkz.
# sirr-motor/Cargo.toml. `--features metal` ile gercek modelde ~2x cozme hizi.
# metal, CLI'nin kendi `candle` cfg bayragini da acmali: yoksa `sirr-motor`
# metalle derlenir ama main.rs'teki `#[cfg(feature="candle")]` kapali kalir ve
# ikili gercek motoru goremeden SahteMotor'a duser.
metal = ["candle", "sirr-motor/metal"]
