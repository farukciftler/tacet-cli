[package]
name = "sirr-hafiza"
version.workspace = true
edition.workspace = true
license.workspace = true

# AG YOK: hafiza CIHAZDAN CIKMAZ. Bu crate yalniz `~/.sirr/hafiza.json`
# okur/yazar; ag cagrisi kurali geregi yalniz sirr-web ve sirr-mcp'de bulunur.
[dependencies]
# serde/serde_json ZATEN workspace bagimliligi (yeni bagimlilik DEGIL).
# Disk bicimi icin SQLite yerine duz JSON secildi; gerekce depo.rs basinda.
serde.workspace = true
serde_json.workspace = true

# Tetikleyici eslestirmesi icin. NEDEN BAGIMLILIK: "hafiza eslestirmesi beceri
# ile AYNI kurali kullanir" bir spec maddesidir; kurali kopyalamak iki uygulama
# demek olurdu ve kopyalar sessizce ayrisirdi. Yon keyfi degil — kural beceri
# katmaninda olculerek dogdu (bkz. sirr-beceri/src/eslesme.rs).
sirr-beceri.workspace = true
