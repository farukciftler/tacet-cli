[package]
name = "tacet-eval"
version = "0.1.10"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Case-based behavioural evaluation for an assistant's tool use."

# EVAL PULLS NO WEIGHTS: `tacet-engine` is taken with its DEFAULT features, so
# the candle tree does not come along. All the cases run on `FakeEngine`; a real
# engine is supplied from outside through `EngineSelector`. That way running eval
# does not depend on a GGUF file or on a build that takes minutes.
[dependencies]
tacet-kernel.workspace = true
tacet-tools.workspace = true
# The grammar constraint runs in eval too: if the production path were
# constrained and eval unconstrained, what is measured would not be the
# application's behaviour.
tacet-grammar.workspace = true
tacet-engine.workspace = true
# THE SKILL GUIDE IS PART OF THE PROMPT PRODUCTION SENDS, so the measurement has
# to build it too — see `selection_prompt` in `tool_selection.rs` for what the
# eval was measuring before this line existed.
tacet-skills.workspace = true
# ONLY TO BUILD A FIXTURE. `archive` is a catalog tool whose logic can be claimed
# without a network or a platform gate, but a case for it needs a REAL .zip on
# disk — and hand-rolling zip bytes in this file would mean the fixture and the
# reader could drift apart, which is the one way an archive case could go green
# while `archive` was broken. `tacet_zip::pack` is the same writer production
# uses; it adds no external dependency (tacet-zip has none).
tacet-zip.workspace = true
serde.workspace = true
serde_json.workspace = true
