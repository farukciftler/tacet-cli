[package]
name = "tacet-grammar"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Constrained generation: turns an argument schema into a pushdown automaton and token mask, so an invalid tool call cannot be generated at all."

# Almost no dependencies. A tokenizer crate is DELIBERATELY ABSENT: the masking
# interface is defined over &[String], so this crate stays unchanged no matter
# which tokenizer is used, and the "pull in no ready-made crates" identity holds.
[dependencies]
# NO INFERENCE DEPENDENCY, AND THAT IS THE FEATURE. The constraint contract is
# three signatures over `&mut [f32]` and `u32`, so this crate needs the kernel
# and nothing else: anyone with a runtime that can hand over a logit slice can
# take the guarantee without taking an engine. It depended on `tacet-engine`
# only because the contract used to live there.
tacet-kernel.workspace = true
# The dependency direction is deliberate: grammar depends on engine, engine does
# NOT depend on grammar. The `Constrainer` contract lives in the engine, its
# implementation (call.rs) lives here. The other way round would force the
# engine to know the grammar's internal representation.
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
