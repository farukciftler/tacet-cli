[workspace]
resolver = "3"
members = [
    "crates/tacet-kernel",
    "crates/tacet-zip",
    "crates/tacet-grammar",
    "crates/tacet-engine",
    "crates/tacet-tools",
    "crates/tacet-skills",
    "crates/tacet-memory",
    "crates/tacet-web",
    "crates/tacet-mcp",
    "crates/tacet-eval",
    "crates/tacet-cli",
]

# The dependency list is deliberately short: Tacet's identity is built on
# "pulling in no ready-made crates" (OOXML zip/deflate/crc32 are written by
# hand). Adding a line here is an architectural decision, not a convenience.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/farukciftler/tacet-cli"
homepage = "https://usetacet.com"
documentation = "https://usetacet.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# REMOVED — `anyhow` and `tokio`: both were declared here but NO crate pulled
# them in. A dead manifest line looks harmless and is not: because it stands in
# the list it counts as "already permitted" and nobody asks for a rationale on
# the next addition. On top of that, for tokio the code says the opposite —
# tacet-engine and tacet-kernel write "this crate MUST NOT PICK an executor, so
# no tokio". A dependency comes back when it is needed, with its rationale.

# 0.1.2 IS THE FLOOR: below it there is no `hash` module, and the MCP client's
# PKCE challenge, the download verifier and the receipt chain would each need
# their own SHA-256 again — three chances for one of them to be quietly wrong.
tacet-kernel = { path = "crates/tacet-kernel", version = "0.1.4" }
tacet-zip = { path = "crates/tacet-zip", version = "0.1.0" }
# 0.1.1 IS THE FLOOR: below it a tool that takes NO arguments cannot be called
# at all — the prompt advertises `disk_usage()` and the grammar refuses it, so
# the model writes something that parses as no call and the tool never runs.
# Remote (MCP) catalogs are full of such tools.
tacet-grammar = { path = "crates/tacet-grammar", version = "0.1.2" }
# EVERY NUMBER BELOW THAT IS NOT 0.1.0 IS A FLOOR, NOT A PREFERENCE, and each
# one was put there by a fix that a `^0.1.0` install would have resolved away.
# `cargo install tacet-cli` picks the newest match, but a machine with an older
# copy already in its registry does not have to move — so a version that carries
# a gate has to be the MINIMUM, or the install looks identical while missing the
# thing it was published for. That has happened here once already (see tacet-web).
# 0.1.3 IS THE FLOOR for anything that reports a measurement: below it an
# engine can only say its own name ("candle"), so four different weight files
# produce four indistinguishable reports and a comparison matrix can silently
# measure one model in every cell.
# 0.1.5 IS THE FLOOR FOR ANY SKILL TO SURVIVE A TOOL CALL: below it the
# `<guidance>` block was written ONLY inside the question turn, and from the
# second turn of the tool loop onward the question is deliberately empty — so
# the skill guidance vanished at exactly the turn where the model is recovering
# from a tool result. `Plain` kept it, which made it worse than a plain bug:
# eval runs on FakeEngine, FakeEngine is `Plain`, so the one template no model
# ever sees was the one template the measurement covered.
# 0.1.8 IS THE FLOOR FOR THE TURN LOOP: below it there is no
# `FINAL_PASS_INSTRUCTION`, so the last pass of a turn is offered tools it
# cannot usefully call and a model that keeps calling ends the turn with
# nothing said. It also carries the quant label fix — below it
# `dominant_quant` counts TENSORS, and Gemma3's six F32 norms per layer
# outvote its quantized body, so a q4 file is reported as `F32` and a
# comparison matrix reads as if the model had been run unquantized.
# 0.1.9 CLOSES A HOLE STRAIGHT THROUGH THE HEADLINE CLAIM. The README says a
# malformed tool call "cannot be GENERATED. Not validated after the fact:
# unrepresentable." The grammar delivered that for every ORDINARY token and
# never covered the one token that is not ordinary: end-of-turn was never
# masked, so a model could simply STOP in the middle of a JSON string. Measured
# on qwen3-4b, a `write_code` call ended on `... print(result]})` with the
# string, the array and the object all still open, `ToolCall::parse` returned
# `None`, and it read from the outside as the model refusing to call the tool.
# Below this version the guarantee has an exception nothing in the code names.
tacet-engine = { path = "crates/tacet-engine", version = "0.1.9" }
# 0.1.3 brought the addon gates and the five tools behind them; below it,
# `catalog.rs` has no gate to ask and `shell`/`http`/`db` do not exist at all.
# 0.1.4 IS THE FLOOR: below it `shell` is offered on Windows, where the timeout
# cannot kill the process group and a runaway command would outlive the turn.
# 0.1.5 IS THE FLOOR for anyone using MCP: below it the router cannot see a
# remote catalog at all (every remote tool scores zero and never enters the
# 9-tool budget), so the model answers "I have no access to servers" while the
# connection is working perfectly.
# 0.1.6 IS THE FLOOR FOR ANY NON-ENGLISH USER: below it the router's trigger
# table is English-only, so a message in Turkish touches nothing, scores zero
# and the tool budget fills with the head of the catalog — `web_search` and
# `remember` were unreachable. It also matched triggers by bare substring, so
# "teşekkürler" contains "url" and a thank-you pulled the web tools forward.
# 0.1.7 CLOSES TWO FAILURES THAT WERE NOT LUCK — each failed in every run of
# every variant measured. Below it a bare `{"kind":"date"}` from the model is
# dropped as ambiguous (two tools accept it, only one of them by a closed set),
# and the memory tool lets the model answer "I'll remember that" without
# calling anything, which tells the user something untrue.
# 0.1.8 carries the trailing-comma repair for small models AND its tests: the
# repair landed untested, and a function that rewrites the model's own words
# before parsing them is the last place to leave untested.
# 0.1.9 FIXES A SENTENCE THE MODEL READS ON EVERY TURN: `create_document`'s
# description said "do note ask or narrate" where it meant "do NOT ask", so the
# one instruction telling the model to act instead of narrating was garbled in
# the prompt itself. It also puts a ceiling under the tool descriptions, which
# are the largest block in the prompt and until now had none — the worst
# nine-tool selection measures 2542 tokens, 62% of the 4096-token floor window,
# re-sent on every pass of the tool loop.
# 0.1.11 IS THE FLOOR: below it `create_document` has no way to NAME its
# destination, so a file asked for in one directory is written to another and
# reported as created; a `remember` save without keywords is refused by the
# store although the schema marks them optional; and a title the body already
# carries is written twice.
# 0.1.12 IS THE FLOOR FOR THE ROUTER, and the defect it fixes had been silently
# setting the ceiling on every tool-selection number this project has ever
# recorded. A tool's score was the sum of the hint lengths matched over its NAME
# AND DESCRIPTION GLUED TOGETHER, so it grew with the SIZE OF ITS PROSE:
# `run_code`, whose thousand-character description correctly says it cannot open
# a FILE, cannot see a FOLDER and must not LIST from MEMORY, outscored
# `find_file` three to one on "Find the file about the budget." — measured with
# the routing set added in this same change, `find_file` sat at rank 7 on its own
# sentence. Below this version the name and the description are still one string,
# `calendar` still outranks `time` on "what time is it", and the English word
# for multiplication is still a WEB trigger.
# 0.1.13 IS THE FLOOR FOR WINDOWS, and the defect was invisible on the two
# platforms this is developed on. The path handed to the model after a write was
# built with `strip_prefix` against a working directory canonicalized at a
# different moment; on Windows canonicalization adds the `\\?\` verbatim
# prefix, so one side carried it, the other did not, the strip silently failed
# and the model was handed a full absolute path — spelled with backslashes,
# which it then has to escape to write back inside a JSON argument. CI had been
# red on windows-latest for exactly this.
tacet-tools = { path = "crates/tacet-tools", version = "0.1.13" }
tacet-skills = { path = "crates/tacet-skills", version = "0.1.0" }
tacet-memory = { path = "crates/tacet-memory", version = "0.1.0" }
# THE NETWORK MONOPOLY: a network call exists ONLY in these two crates. No
# other crate opens a socket; so the rule can be audited by eye rather than by
# an `audit` script, the HTTP dependency also stands only in these two manifests.
# 0.1.2 CARRIED THE SSRF GATE; `^0.1.0` would happily have resolved to 0.1.1,
# which does not have it. 0.1.3 IS THE FLOOR NOW: below it the `http` addon's
# host allow-list cannot read its own stored form, so a multi-host install
# refuses every call it was configured to permit.
# 0.1.5 IS THE FLOOR FOR `tacet update`: below it the release asset's
# published SHA-256 is never read, so every update is trust-on-first-use over
# TLS alone — while the API response already carried the digest. It also
# refuses a dotless host in the addon allow-list, where `merhaba` used to be
# accepted as a hostname.
tacet-web = { path = "crates/tacet-web", version = "0.1.5" }
# 0.2.0 SPEAKS THE 2026-07-28 REVISION: stateless requests, the `_meta`
# envelope, MRTR, poll-based tasks, issuer-bound OAuth. The 0.1 line speaks only
# the frozen revision, and a `^0.1` resolve would silently put a client on it.
tacet-mcp = { path = "crates/tacet-mcp", version = "0.2.0" }
# 0.1.7 IS THE FLOOR FOR ANY MEASUREMENT THAT WILL BE COMPARED: below it the
# logic runner repeats the user's question AFTER the tool result on every
# pass — the shape the shell removed because it caused the loop — so the set
# measures a prompt the product does not build. It also adds the claims that
# found what the old ones could not: `grounded` (no number in the answer that
# no tool produced), the call budget, and the model/Tacet attribution.
# 0.1.8 IS THE FLOOR FOR ANY NUMBER THAT WILL BE BELIEVED, and it carries four
# corrections to the INSTRUMENT rather than to the thing measured:
#   * `routing` — the router's own choice, no weights, milliseconds. It sets the
#     ceiling on the selection number and had no measurement of its own.
#   * The generation budget. The selection set handed the model
#     `SamplingSetting::default()` (1024 tokens) while the shell hands it
#     `generation_cap` (~14000 on qwen3-4b), so the two cases that ask for a real
#     script were failing on a limit production does not impose.
#   * The language gate PASSED EVERYTHING. It matched two-letter markers as
#     substrings, so "have" satisfied the Turkish "ve" and "için" satisfied the
#     English "in"; every Turkish case had been reporting a perfect answer rate
#     against a check no input could fail.
#   * The prompt. The set built no `<guidance>` block, so it measured a prompt
#     the app has never sent.
tacet-eval = { path = "crates/tacet-eval", version = "0.1.9" }
