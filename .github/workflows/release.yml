name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # PROVENANCE NEEDS TWO MORE, and neither is optional for it to mean anything.
  # `id-token: write` lets the job get an OIDC token so Sigstore can bind the
  # attestation to THIS workflow at THIS commit; `attestations: write` lets it
  # be stored. Without them `actions/attest-build-provenance` fails rather than
  # silently producing nothing, which is the correct direction.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features` IS PART OF THE MATRIX because a released binary without
          # inference is not the program people install. `metal` is Apple-only;
          # everywhere else `candle` gives CPU inference. A user who ran
          # `cargo install --features metal` and then `tacet update --install`
          # used to end up with a binary that fell back to the fake engine, and
          # the only sign was one grey line above the prompt.
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "", features: metal }
          # Intel macOS is CROSS-COMPILED on the Apple Silicon runner. The
          # macos-13 runner it used to need is being retired and its queue can
          # sit unserved indefinitely; the Apple toolchain builds both
          # architectures from either host, so the runner is not load-bearing.
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: "", features: metal }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: "", features: candle }
          # ARM64 LINUX IS A NATIVE BUILD, NOT A CROSS-COMPILE, and the reason is
          # the feature check below: it RUNS the binary it just built, which an
          # x86 host cannot do for an aarch64 target. Dropping that check to
          # cross-compile would trade a real guard for a cheaper job.
          #
          # It exists because the client half of the contract was already
          # written: `update::host_triple` maps ("aarch64", "linux") to this
          # triple, so a Raspberry Pi asked for an asset the release never
          # produced and `tacet update --install` answered "not published for
          # your platform". Single-board ARM Linux is where the edge work in
          # esp32/ is heading, so it is the one platform that has to be
          # installable rather than built from source.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "", features: candle }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe", features: candle }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # WITH the inference feature for the platform. This costs build time and
      # binary size; the alternative cost was users losing model inference on
      # update, which is worse and invisible.
      - run: cargo build --release -p tacet-cli --target ${{ matrix.target }} --features ${{ matrix.features }}

      # The binary must be able to answer what it was built with — `tacet update
      # --install` runs exactly this on the downloaded file and refuses to swap
      # if the answer is weaker than the running build. A release that ships the
      # wrong answer here would defeat that guard, so it is checked at build time.
      - name: The binary reports its features
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          got=$(./target/${{ matrix.target }}/release/tacet --print-features 2>/dev/null || echo MISSING)
          echo "reported: $got  expected: ${{ matrix.features }}"
          [ "$got" = "${{ matrix.features }}" ] || exit 1

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/tacet${{ matrix.ext }}"
          name="tacet-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          # The bare, UNVERSIONED binary as well. `tacet update --install`
          # fetches this one: taking the archive would mean the updater had to
          # unpack tar or zip, which is either a new crate dependency or a
          # dependency on whatever happens to be installed on the user's box.
          # The name is a contract with crates/tacet-cli/src/update.rs
          # (`asset_name`) — change one, change both. It carries no version, so
          # it cannot collide with the archive above.
          cp "$name/tacet${{ matrix.ext }}" "tacet-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/tacet-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # WHAT SHA256SUMS DOES AND DOES NOT PROVE. It proves the release job agreed
      # with itself: the same job computed the hashes and uploaded the binaries,
      # so anyone who can replace one can replace both. It is a corruption check,
      # not a provenance check, and this file used to stop there.
      #
      # The attestation below is the missing half. It binds each asset to this
      # repository, this workflow file and this commit, signed through Sigstore
      # with a short-lived OIDC identity — no long-lived key exists to leak.
      # Anyone can verify without trusting this job:
      #
      #     gh attestation verify tacet-aarch64-apple-darwin \
      #        --repo farukciftler/tacet-cli
      #
      # This matters more here than for most CLIs: `tacet update` downloads and
      # REPLACES THE RUNNING BINARY. It already verifies the per-asset digest the
      # GitHub API reports (`update.rs`), and says so honestly when it cannot —
      # what was missing was any way to check that GitHub's digest describes
      # something this repository actually built.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      # AN SBOM, because "almost no dependencies" is an argument about the
      # transitive graph and the graph is not in the release. `cargo-deny` checks
      # it at build time (see ci.yml); this publishes it, so someone downstream
      # can answer "is this affected by <today's advisory>" without cloning the
      # repository and resolving it themselves.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: tacet-sbom.spdx.json
          output-file: dist/tacet-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # `tacet update` reads this release's tag and assets. The asset naming
      # scheme above is a contract with src/update.rs — change one, change both.
      # The SBOM and SHA256SUMS do not match that scheme and are ignored by it.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
