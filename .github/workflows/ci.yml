name: CI

on:
  push:
    branches: [main]
  pull_request:

# READ-ONLY, AND SAID HERE RATHER THAN LEFT TO THE REPOSITORY DEFAULT. Every job
# below compiles and runs third-party build scripts (`ring`, `onig_sys`) and
# third-party actions; none of them has a reason to push, comment or mint an
# OIDC token, so none of them is given a token that could.
#
# EVERY `uses:` IS A COMMIT SHA, with the tag it was taken from in the comment.
# A tag is a pointer its owner can move; a SHA is the code that was read.
# `.github/dependabot.yml` proposes the bumps, so pinning does not mean
# freezing. `the_workflows_keep_their_promises.rs` fails on an unpinned action.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The point of the matrix: macOS is the only platform where this project has
  # ever been run by a human. Linux and Windows compile-and-test here or the
  # claim that they are supported is not a claim, it is a hope.
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # THE WHOLE HISTORY, because tests read it: the README's model table
        # is dated by the commit that first held its rows, and the replaced
        # 3090 run by `git rev-list --count`. The default depth of 1 made that
        # one commit "introduce" every row, and the date test went red on all
        # three platforms (review of 10 Oct 2026). The tests now refuse a
        # shallow clone outright rather than measure it.
        with:
          fetch-depth: 0
      # `stable` IS A BRANCH of dtolnay/rust-toolchain, not a tag, so the pin is
      # that branch's head on 10 Oct 2026 and the toolchain is named explicitly
      # — a SHA carries no toolchain name for the action to infer one from.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # THE SANDBOX, ON THE ONE PLATFORM WHERE IT HAD NEVER RUN.
      #
      # `run_code` and `write_code` refuse to enter the catalog unless a shield
      # can be found AND measured, so on a runner without bubblewrap every one of
      # their process tests took the `tool_or_skip()` escape hatch and passed by
      # printing a line. 26 on Linux — 16 in run_code.rs, 10 in write_code.rs: the
      # network cut, the write confinement, the timeout kill, the output cap, the
      # `node --check` / `python3 -m py_compile` verification path, and the
      # discovery assert, all reporting green having executed nothing.
      #
      # COUNTED, not estimated — and no longer counted BY HAND, because by hand
      # it was wrong. This comment first said TWENTY-FOUR. So
      # `the_skip_count_the_documents_quote_is_the_count_in_the_source`
      # (run_code.rs) now derives the three figures from the `#[test]` functions
      # whose body calls `tool_or_skip()` — minus `the_clipboard_is_really_cut`,
      # which is `#[cfg(target_os = "macos")]` and does not compile here at all —
      # and fails if this line disagrees with them.
      #
      # One `apt-get install` is what makes those 26 real, which is why this
      # lives in the existing matrix job rather than in a fourth job: it needs no
      # second cold Rust build and no second cache key.
      # The cost is entirely test time — the newly-enabled tests carry 20-25 s
      # timeouts and each `discover()` re-runs `verify_shield` with a 15 s bound.
      #
      # THE RISK, PLAINLY: bwrap needs unprivileged user namespaces. GitHub's
      # ubuntu image is a VM rather than a container and ships an AppArmor
      # profile with the bubblewrap package that is expected to permit them, but
      # THIS HAS NOT BEEN MEASURED BY THE AUTHOR — nobody here has a Linux
      # machine, which is the whole reason this gap existed. If the runner
      # refuses, the preflight below fails the job with bwrap's own message and
      # the kernel state printed above it. That is the point: a red job naming
      # the reason, never a green job full of skips. Do not add
      # `continue-on-error` here. If the refusal turns out to be the AppArmor
      # policy rather than the kernel, the one-line remedy is
      # `sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0` before
      # the preflight — and it belongs in a commit that records the date and what
      # the job actually printed, because the runner is a throwaway VM and what
      # is under measurement is bwrap's guarantee, not the distro's policy.
      - name: install and preflight the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # State FIRST, so a failure on the next line is diagnosable from the
          # log alone rather than from a second push.
          cat /proc/sys/user/max_user_namespaces || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          bwrap --version
          # THE REMEDY THE COMMENT ABOVE PREDICTED, NOW MEASURED RATHER THAN
          # GUESSED. Run 33863502596 on 2026-09-04 printed exactly this and then
          # stopped the job:
          #     63838
          #     kernel.apparmor_restrict_unprivileged_userns = 1
          #     bubblewrap 0.9.0
          #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
          # So the refusal was the APPARMOR POLICY, not the kernel: 63838 user
          # namespaces were available and bwrap installed cleanly. Ubuntu 24.04
          # ships that restriction on by default, and `--unshare-net` needs
          # CAP_NET_ADMIN inside the new netns to bring loopback up — a capability
          # the userns cannot grant while the policy holds.
          #
          # WHAT THIS LINE DOES AND DOES NOT BUY. It relaxes a DISTRO POLICY on a
          # throwaway VM so that bwrap's own guarantee can be measured; it does
          # not weaken anything Tacet ships. On a user's machine the policy stays
          # as their distro set it, and if it refuses there, `verify_shield` fails
          # and run_code LEAVES THE CATALOG — the honest-refusal path, not a hole.
          # The line is therefore about reaching the measurement, and the thing
          # under measurement is still bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns
          # The same shape `bwrap_args` builds. If this cannot start, nothing
          # below can either, and the job must stop here.
          bwrap --unshare-net --unshare-pid --unshare-ipc --unshare-uts \
                --die-with-parent --ro-bind / / --dev /dev --proc /proc \
                -- /bin/echo SANDBOX_UP

      - run: cargo build --workspace

      # TACET_SANDBOX_MUST_RUN turns "there is no sandbox here" from a printed
      # skip into a panic carrying `RunCodeTool::diagnose()`. It is set ONLY on
      # Linux: macOS discovers `sandbox-exec` and needs no help, and on Windows
      # the tools are deliberately absent, so there a skip is the truth.
      # `runner.os == 'Linux' && '1' || ''` is the GitHub-expression form of that
      # — the other two platforms get the empty string, which `sandbox_must_run`
      # reads as unset. `ci_sets_the_variable_that_turns_a_skip_into_a_failure`
      # in run_code.rs asserts this block still exists.
      - run: cargo test --workspace
        env:
          TACET_SANDBOX_MUST_RUN: ${{ runner.os == 'Linux' && '1' || '' }}

  # THE TRANSITIVE HALF OF THE "ALMOST NO DEPENDENCIES" CLAIM.
  #
  # The README's argument is that a reader can audit this program by reading it —
  # six direct dependencies, three more behind an off-by-default feature. Nobody
  # reads the transitive graph, and that is where the claim can quietly stop
  # being true: a git dependency, a patched fork, a yanked crate, a licence
  # nobody chose.
  #
  # TWO JOBS, BECAUSE ONE JOB CANNOT BE BOTH A GATE AND A NEWS FEED.
  #
  # This used to be a single `cargo deny check` with `continue-on-error: true`
  # at the job level, and the README said `unknown-git` and `unknown-registry`
  # were "hard failures". They were not: `continue-on-error` applies to the
  # whole job, so a `git =` dependency produced the same green tick as a clean
  # graph. `deny.toml` saying `deny` was a setting nothing enforced.
  #
  # So the split is by WHO CAN CAUSE THE FAILURE. Sources, bans and licences
  # change only when a manifest or `Cargo.lock` in this repository changes, so
  # a failure there is a defect in the pull request and it gates. Measured
  # before the split, 10 Oct 2026, with cargo-deny 0.20.2 and all features:
  # `bans ok, licenses ok, sources ok` — the gate starts green.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check sources bans licenses
          arguments: --all-features

  # ADVISORIES ARE NEWS ABOUT THE WORLD, so this one alone is soft. A new
  # advisory filed against a crate four levels down is not a defect in this
  # pull request, and a hard gate here would block a documentation fix on
  # someone else's CVE. The value is the annotation on the run.
  supply-chain-advisories:
    name: supply chain (advisories)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --all-features

  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  # THE FOURTH GATE, ON EVERY PULL REQUEST.
  #
  # `tacet-engine`'s whole `candle_engine` module is behind
  # `#[cfg(feature = "candle")]`, so the `test` job above does not compile a
  # line of it. This lived only in nightly.yml, which meant a pull request
  # could break the decode loop's COMPILE and merge green — CONTRIBUTING
  # records that happening, with the failure arriving hours later from the
  # nightly run. `--no-run` because every test behind the feature needs a
  # 2.5 GB GGUF and would print SKIPPED; the claim this job makes is "it
  # compiles", and that is the claim it can check.
  #
  # ITS OWN JOB, so it gets its own `rust-cache` entry: the candle tree is the
  # largest part of the graph and sharing a key with the `test` job would make
  # the two evict each other.
  candle-compiles:
    name: the candle-gated code compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --features candle --no-run

  eval:
    name: behavioural eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Runs against the deterministic mock engine: it measures the routing and
      # tool-call machinery, not a model. No weights are downloaded.
      - run: cargo run -p tacet-cli -- eval

      # THE ROUTER'S OWN MEASUREMENT, and it gates because it is a LIMIT rather
      # than a score: a tool the router leaves out of the budget is not in the
      # prompt, so no model can call it. Every failure here is a defect in this
      # repository, which is exactly the class of thing CI is for. It needs no
      # weights and finishes in milliseconds.
      #
      # WHY IT IS WORTH A LINE IN THIS FILE: before it existed, a routing
      # regression was invisible until somebody spent twenty minutes running
      # `--tool-selection` on a machine with a 2 GB model, and it arrived
      # labelled "the model got worse". The first run of this gate found
      # `find_file` sitting at rank 7 on the sentence "Find the file about the
      # budget."
      - run: cargo run -p tacet-cli -- eval --routing

      # THE SAME GATE WITH A SERVER CONNECTED. Thirteen tools against a budget
      # of nine can only crowd out four; the run above is therefore nearly free
      # to pass. Thirty-three against nine is what a machine with one MCP server
      # looks like, and it is the only shape where a tool realistically falls
      # out of the prompt.
      - run: cargo run -p tacet-cli -- eval --routing --routing-pressure 20
